3px 0 15px"><button class="btn" data-find>◷ Найти время</button></div>`}function eventCard(e){return `<button class="event-card ${e.cancelled?'cancelled':''}" style="${cssColor(e.color)}" data-edit="${e.id}" data-occurrence-date="${e.date}"><span><strong>${esc(e.title)}</strong><p>◷ ${e.start} – ${e.end}</p><p>⌖ ${esc(e.place||'Без места')}</p>${e.note&&e.note.trim()?`<p class="overview-note">${esc(e.note)}</p>`:""}${e.cancelled?'<small>Отменено</small>':''}</span><span style="display:flex;gap:5px">${e.members.slice(0,3).map(m=>`<span class="avatar">${initials(m)}</span>`).join('')}</span></button>`}function overview(){let es=occur(iso(focus),iso(focus));return `<div class="overview"><h1>▢ Семейный календарь</h1><p class="sub">${focus.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</p>${chips()}<section class="panel"><h2>Сегодня <button class="btn" data-page="calendar" style="float:right">›</button></h2>${es.length?es.map(eventCard).join(''):'<p class="empty">На этот день событий нет</p>'}</section><div class="tile-row"><button class="tile" data-page="calendar"><span style="font-size:32px">▦</span><span>Календарь<small>День · Неделя · Месяц</small></span>›</button><button class="tile" data-page="tasks"><span style="font-size:32px">☑</span><span>Дела<small>${tasks.filter(x=>!x.done).length} дела на сегодня</small></span>›</button></div><button class="btn find-wide" data-find>♧ &nbsp; Найти общее время &nbsp; ›</button></div>`}function grid(){let days=view==='day'?[focus]:Array.from({length:7},(_,i)=>plus(monday(focus),i));let all=occur(iso(days[0]),iso(days.at(-1)));let min=Math.min(7,...all.map(e=>Math.floor(tim(e.start)/60)));let max=Math.max(20,...all.map(e=>Math.ceil(tim(e.end)/60)));let h=all.some(e=>e.note&&e.note.trim())?78:54;return `<div class="surface calendar-wrap"><div class="cal days${days.length}" style="--days:${days.length};--hour:${h}px"><div class="cal-head"><div class="time-head"></div>${days.map(d=>`<div class="day-head" d
